<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
ประวัติการจอง | Mon Bridge Stay
</title>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:#f8f9fa;

    color:#4e342e;

    font-family:
    Arial,
    "Tahoma",
    sans-serif;
}


/* NAV */

.nav{

    background:#5d4037;

    color:white;

    padding:18px 7%;

    font-size:23px;

    font-weight:800;
}


.nav-links{

    float:right;
}


.nav a{

    color:white;

    text-decoration:none;

    margin-left:25px;

    font-size:16px;
}



/* WRAP */

.wrap{

    max-width:1100px;

    margin:55px auto;

    padding:0 18px;
}


.title{

    font-size:38px;

    font-weight:900;

    margin-bottom:28px;
}



/* SEARCH */

.search{

    background:white;

    padding:25px;

    border-radius:22px;

    box-shadow:
    0 8px 24px
    rgba(0,0,0,.07);

    display:flex;

    gap:12px;
}


.search input{

    height:58px;

    flex:1;

    border:1px solid #d8cbc4;

    border-radius:15px;

    padding:0 18px;

    font-size:17px;
}


.search button{

    border:0;

    border-radius:15px;

    background:#795548;

    color:white;

    padding:0 25px;

    font-weight:800;

    cursor:pointer;
}



/* CARD */

.card{

    background:white;

    border-radius:22px;

    padding:25px;

    margin-top:25px;

    box-shadow:
    0 8px 24px
    rgba(0,0,0,.07);
}


.booking-code{

    font-size:27px;

    font-weight:900;

    color:#795548;

    margin-bottom:15px;
}


.rowx{

    display:flex;

    justify-content:space-between;

    padding:12px 0;

    border-bottom:
    1px dashed #ddd;
}


.rowx:last-child{

    border-bottom:none;
}


.pending{

    color:#a06f00;

    font-weight:800;
}


.confirmed{

    color:#198754;

    font-weight:800;
}


.cancelled{

    color:#dc3545;

    font-weight:800;
}


.empty{

    text-align:center;

    padding:50px;

    color:#777;
}



/* MOBILE */

@media(max-width:600px){

    .nav-links a{

        display:none;
    }


    .search{

        flex-direction:column;
    }


    .search button{

        height:52px;
    }


    .title{

        font-size:30px;
    }


    .rowx{

        gap:15px;

        align-items:flex-start;
    }


    .rowx strong{

        text-align:right;
    }

}

</style>

</head>


<body>



<nav class="nav">


🏠 Mon Bridge Stay


<div class="nav-links">

<a href="index.html">
หน้าแรก
</a>


<a href="booking.html">
จองที่พัก
</a>

</div>


</nav>



<main class="wrap">


<div class="title">

📖 ประวัติการจอง

</div>



<div class="search">


<input
id="keyword"
placeholder="กรอกรหัสการจองหรือเบอร์โทรศัพท์"
>


<button
onclick="searchBookings()"
>

ค้นหา

</button>


</div>



<div
id="result"
class="empty"
>

กรุณากรอกรหัสการจอง
หรือเบอร์โทรศัพท์

</div>


</main>



<script>


/* ==========================================
   SUPABASE
========================================== */


const SUPABASE_URL =
"https://drojzwcelybbbkyptmns.supabase.co";


const SUPABASE_KEY =
"sb_publishable_JHexmXkHfhzsMT9iRMf1gg_Srdcw7UM";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* ==========================================
   HELPERS
========================================== */


function escapeHTML(text){

    return String(text ?? "")
    .replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[match];

        }
    );

}



function money(number){

    return Number(
        number || 0
    )
    .toLocaleString("th-TH")
    + " บาท";

}



function dateTH(value){

    if(!value)
        return "-";


    const [
        year,
        month,
        day
    ] =
    value.split("-");


    return (
        day +
        "/" +
        month +
        "/" +
        (Number(year)+543)
    );

}



/* ==========================================
   STATUS
========================================== */


function statusHTML(status){

    if(
        status ===
        "confirmed"
    ){

        return `
        <span class="confirmed">
            🟢 ยืนยันแล้ว
        </span>
        `;

    }


    if(
        status ===
        "cancelled"
    ){

        return `
        <span class="cancelled">
            🔴 ยกเลิก
        </span>
        `;

    }


    return `
    <span class="pending">
        🟡 รอยืนยัน
    </span>
    `;

}



/* ==========================================
   SEARCH
========================================== */


async function searchBookings(){

    const keyword =
    document
    .getElementById(
        "keyword"
    )
    .value
    .trim();


    const result =
    document.getElementById(
        "result"
    );



    if(!keyword){

        result.className =
        "empty";


        result.textContent =
        "กรุณากรอกรหัสการจองหรือเบอร์โทรศัพท์";


        return;

    }



    result.className =
    "empty";


    result.textContent =
    "กำลังค้นหา...";



    const {
        data,
        error
    } =
    await supabaseClient
    .from("bookings")
    .select("*")
    .or(
        `booking_code.eq.${keyword},phone.eq.${keyword}`
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );



    if(error){

        console.error(
            error
        );


        result.innerHTML = `

        <span style="color:red">

            ค้นหาไม่สำเร็จ

            <br><br>

            ${escapeHTML(
                error.message
            )}

        </span>

        `;

        return;

    }



    if(
        !data ||
        data.length === 0
    ){

        result.className =
        "empty";


        result.textContent =
        "ไม่พบข้อมูลการจอง";


        return;

    }



    result.className =
    "";


    result.innerHTML =
    data.map(
    booking => {


        return `

        <div class="card">


            <div class="booking-code">

                ${escapeHTML(
                    booking.booking_code
                )}

            </div>



            <div class="rowx">

                <span>
                    สถานะ
                </span>

                <strong>

                    ${statusHTML(
                        booking.status
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ผู้จอง
                </span>

                <strong>

                    ${escapeHTML(
                        booking.name
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    เบอร์โทร
                </span>

                <strong>

                    ${escapeHTML(
                        booking.phone
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ที่พัก
                </span>

                <strong>

                    ${escapeHTML(
                        booking.property
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ประเภทห้อง
                </span>

                <strong>

                    ${escapeHTML(
                        booking.room_type
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    เช็กอิน
                </span>

                <strong>

                    ${dateTH(
                        booking.checkin
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    เช็กเอาต์
                </span>

                <strong>

                    ${dateTH(
                        booking.checkout
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    จำนวนคืน
                </span>

                <strong>

                    ${booking.nights || 0}
                    คืน

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ผู้เข้าพัก
                </span>

                <strong>

                    ${booking.guests || 0}
                    คน

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ราคาต่อคืน
                </span>

                <strong>

                    ${money(
                        booking.price_per_night
                    )}

                </strong>

            </div>



            <div class="rowx">

                <span>
                    ราคารวม
                </span>

                <strong>

                    ${money(
                        booking.total_price
                    )}

                </strong>

            </div>


        </div>

        `;

    })
    .join("");

}



/* ENTER */

document
.getElementById(
    "keyword"
)
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            searchBookings();

        }

    }
);


</script>


</body>

</html>
