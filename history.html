<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ประวัติการจอง | Mon Bridge Stay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f8f9;
    color:#4e342e;
    font-family:"Segoe UI","Tahoma",sans-serif;
}

.navbar{
    background:white;
    border-bottom:1px solid #e5e5e5;
    padding:18px 7%;
}

.brand{
    text-decoration:none;
    color:#111;
    font-size:25px;
    font-weight:700;
}

.container{
    max-width:1100px;
    margin:50px auto;
    padding:0 20px;
}

.title{
    font-size:36px;
    font-weight:700;
    margin-bottom:10px;
}

.subtitle{
    color:#795548;
    margin-bottom:30px;
}

.search-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:30px;
}

.search-row{
    display:flex;
    gap:12px;
}

.search-input{
    flex:1;
    height:55px;
    border:1px solid #d6cbc5;
    border-radius:12px;
    padding:0 18px;
    font-size:16px;
}

.search-btn{
    height:55px;
    padding:0 25px;
    border:none;
    border-radius:12px;
    background:#795548;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.booking-card{
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.booking-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #eee;
    padding-bottom:18px;
    margin-bottom:15px;
}

.booking-code{
    font-size:20px;
    font-weight:800;
}

.status{
    padding:7px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.pending{
    background:#fff2c7;
    color:#8a6800;
}

.confirmed{
    background:#ddf5e4;
    color:#1b743b;
}

.cancelled{
    background:#ffe1e1;
    color:#b52a2a;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:10px 0;
    border-bottom:1px dashed #ddd;
}

.row:last-child{
    border-bottom:none;
}

.value{
    text-align:right;
    font-weight:700;
}

.total{
    color:#795548;
    font-size:22px;
}

.empty{
    text-align:center;
    background:white;
    padding:50px;
    border-radius:20px;
    color:#795548;
}

@media(max-width:700px){

    .search-row{
        flex-direction:column;
    }

    .booking-head{
        flex-direction:column;
        align-items:flex-start;
    }

    .row{
        flex-direction:column;
        gap:3px;
    }

    .value{
        text-align:left;
    }

}

</style>

</head>

<body>


<nav class="navbar">

    <a
        href="index.html"
        class="brand">

        🏠 Mon Bridge Stay

    </a>

</nav>


<div class="container">

    <h1 class="title">
        📖 ประวัติการจอง
    </h1>

    <p class="subtitle">
        ค้นหาประวัติการจองด้วยเบอร์โทรศัพท์หรือรหัสการจอง
    </p>


    <div class="search-card">

        <div class="search-row">

            <input
                id="searchInput"
                class="search-input"
                placeholder="กรอกเบอร์โทรศัพท์ หรือรหัสการจอง">

            <button
                id="searchButton"
                class="search-btn">

                🔎 ค้นหา

            </button>

        </div>

    </div>


    <div id="result">

        <div class="empty">

            🔎 กรุณากรอกเบอร์โทรศัพท์หรือรหัสการจอง

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   SEARCH
========================================================= */

async function searchBookings(){

    const keyword =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const result =
        document.getElementById(
            "result"
        );


    if(!keyword){

        result.innerHTML = `

            <div class="empty">
                ⚠️ กรุณากรอกเบอร์โทรศัพท์หรือรหัสการจอง
            </div>

        `;

        return;

    }


    result.innerHTML = `

        <div class="empty">
            ⏳ กำลังค้นหา...
        </div>

    `;


    /*
      ค้นหาจาก phone หรือ booking_code
    */

    const {
        data,
        error
    } = await supabaseClient
        .from("bookings")
        .select("*")
        .or(
            `phone.eq.${keyword},booking_code.eq.${keyword}`
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        result.innerHTML = `

            <div class="empty">

                ❌ เกิดข้อผิดพลาด

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if(!data || !data.length){

        result.innerHTML = `

            <div class="empty">

                📭 ไม่พบประวัติการจอง

                <br>

                กรุณาตรวจสอบเบอร์โทรศัพท์
                หรือรหัสการจองอีกครั้ง

            </div>

        `;

        return;

    }


    result.innerHTML =
        data.map(
            booking =>
            createBookingCard(
                booking
            )
        ).join("");

}


/* =========================================================
   CARD
========================================================= */

function createBookingCard(booking){

    const status =
        booking.status ||
        "pending";


    let statusText =
        "⏳ รอยืนยัน";

    let statusClass =
        "pending";


    if(status === "confirmed"){

        statusText =
            "✅ ยืนยันแล้ว";

        statusClass =
            "confirmed";

    }


    if(status === "cancelled"){

        statusText =
            "❌ ยกเลิก";

        statusClass =
            "cancelled";

    }


    return `

        <div class="booking-card">

            <div class="booking-head">

                <div class="booking-code">

                    🧾 ${escapeHtml(
                        booking.booking_code
                    )}

                </div>

                <div class="status ${statusClass}">

                    ${statusText}

                </div>

            </div>


            <div class="row">

                <span>ผู้จอง</span>

                <span class="value">
                    ${escapeHtml(
                        booking.name
                    )}
                </span>

            </div>


            <div class="row">

                <span>เบอร์โทรศัพท์</span>

                <span class="value">
                    ${escapeHtml(
                        booking.phone
                    )}
                </span>

            </div>


            <div class="row">

                <span>ที่พัก</span>

                <span class="value">
                    ${escapeHtml(
                        booking.accommodation
                    )}
                </span>

            </div>


            <div class="row">

                <span>ประเภทห้อง</span>

                <span class="value">
                    ${escapeHtml(
                        booking.room
                    )}
                </span>

            </div>


            <div class="row">

                <span>เช็กอิน</span>

                <span class="value">
                    ${formatDate(
                        booking.check_in
                    )}
                </span>

            </div>


            <div class="row">

                <span>เช็กเอาต์</span>

                <span class="value">
                    ${formatDate(
                        booking.check_out
                    )}
                </span>

            </div>


            <div class="row">

                <span>จำนวนคืน</span>

                <span class="value">
                    ${booking.nights || 0} คืน
                </span>

            </div>


            <div class="row">

                <span>จำนวนผู้เข้าพัก</span>

                <span class="value">
                    ${booking.guests || 0} คน
                </span>

            </div>


            <div class="row">

                <span>ราคาต่อคืน</span>

                <span class="value">
                    ${Number(
                        booking.price_per_night || 0
                    ).toLocaleString()}
                    บาท / คืน
                </span>

            </div>


            <div class="row">

                <span>ราคาทั้งหมด</span>

                <span class="value total">
                    ${Number(
                        booking.total_price || 0
                    ).toLocaleString()}
                    บาท
                </span>

            </div>

        </div>

    `;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(
            value + "T00:00:00"
        );

    return date.toLocaleDateString(
        "th-TH",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =========================================================
   HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   EVENTS
========================================================= */

document.getElementById(
    "searchButton"
).addEventListener(
    "click",
    searchBookings
);


document.getElementById(
    "searchInput"
).addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            searchBookings();

        }

    }
);

</script>

</body>
</html>
