<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ประวัติการจอง | Mon Bridge Stay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f8fa;
    color:#3f302a;
    font-family:
        "Noto Sans Thai",
        "Segoe UI",
        sans-serif;
}

.navbar{
    height:72px;
    background:white;
    border-bottom:1px solid #e6e6e6;
    display:flex;
    align-items:center;
    padding:0 7%;
}

.logo{
    font-size:25px;
    font-weight:700;
    color:#171717;
}

.container{
    width:90%;
    max-width:1100px;
    margin:50px auto;
}

h1{
    font-size:34px;
    margin-bottom:30px;
}

.search-card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.search-card label{
    display:block;
    font-weight:700;
    margin-bottom:10px;
}

.search-row{
    display:flex;
    gap:12px;
}

input{
    flex:1;
    padding:16px;
    border:1px solid #d7d0cb;
    border-radius:12px;
    font-size:17px;
}

button{
    border:none;
    background:#795548;
    color:white;
    padding:0 25px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#5d4037;
}

.result{
    margin-top:30px;
}

.booking-card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.booking-code{
    font-size:24px;
    font-weight:800;
    color:#795548;
    margin-bottom:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px dashed #ddd;
    gap:20px;
}

.row:last-child{
    border-bottom:none;
}

.status{
    display:inline-block;
    padding:7px 13px;
    border-radius:20px;
    font-weight:700;
}

.pending{
    background:#fff1c7;
    color:#8a6500;
}

.confirmed{
    background:#d9f5df;
    color:#18752d;
}

.cancelled{
    background:#f9dede;
    color:#a62929;
}

.empty{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:20px;
}

@media(max-width:700px){

    .navbar{
        padding:0 20px;
    }

    .container{
        width:94%;
        margin:30px auto;
    }

    .search-row{
        flex-direction:column;
    }

    button{
        min-height:55px;
    }

    .row{
        flex-direction:column;
        gap:5px;
    }

}

</style>

</head>


<body>


<nav class="navbar">

<div class="logo">
🏠 Mon Bridge Stay
</div>

</nav>


<div class="container">

<h1>
📖 ประวัติการจอง
</h1>


<div class="search-card">

<label>
📞 เบอร์โทรศัพท์ที่ใช้จอง
</label>

<div class="search-row">

<input
type="tel"
id="phone"
maxlength="10"
placeholder="เช่น 0812345678">

<button
onclick="searchBookings()">

🔎 ค้นหาการจอง

</button>

</div>

</div>


<div
id="result"
class="result">

</div>


</div>


<script>

/* ================================
   SUPABASE ชุดเดียวกัน
================================ */

const SUPABASE_URL =
"https://drojzwcelybbbbkyptmns.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JHexmXkHfhzsMT9iRMf1gg_Srdcw7UM";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   ค้นหา
================================ */

async function searchBookings(){

    const phone =
    document.getElementById(
        "phone"
    ).value.trim();


    const result =
    document.getElementById(
        "result"
    );


    if(!/^[0-9]{10}$/.test(phone)){

        result.innerHTML = `
        <div class="empty">

        ⚠️ กรุณากรอกเบอร์โทรศัพท์ 10 หลัก

        </div>
        `;

        return;

    }


    result.innerHTML = `
    <div class="empty">

    🔄 กำลังค้นหา...

    </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("bookings")
    .select("*")
    .eq("phone",phone)
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        result.innerHTML = `
        <div class="empty">

        ❌ เกิดข้อผิดพลาด

        <br><br>

        ${escapeHtml(error.message)}

        </div>
        `;

        return;

    }


    if(!data || data.length === 0){

        result.innerHTML = `
        <div class="empty">

        📭 ไม่พบประวัติการจอง

        </div>
        `;

        return;

    }


    result.innerHTML =
    data.map(
        booking => `

        <div class="booking-card">

        <div class="booking-code">

        ${escapeHtml(booking.code)}

        </div>


        <div class="row">

        <span>👤 ผู้จอง</span>

        <strong>
        ${escapeHtml(booking.name)}
        </strong>

        </div>


        <div class="row">

        <span>🏠 ที่พัก</span>

        <strong>
        ${escapeHtml(booking.accommodation)}
        </strong>

        </div>


        <div class="row">

        <span>🛏️ ประเภทห้อง</span>

        <strong>
        ${escapeHtml(booking.room_type)}
        </strong>

        </div>


        <div class="row">

        <span>📅 เช็กอิน</span>

        <strong>
        ${formatThaiDate(booking.check_in)}
        </strong>

        </div>


        <div class="row">

        <span>📅 เช็กเอาต์</span>

        <strong>
        ${formatThaiDate(booking.check_out)}
        </strong>

        </div>


        <div class="row">

        <span>🌙 จำนวนคืน</span>

        <strong>
        ${booking.nights} คืน
        </strong>

        </div>


        <div class="row">

        <span>👥 ผู้เข้าพัก</span>

        <strong>
        ${booking.guests} คน
        </strong>

        </div>


        <div class="row">

        <span>💰 ราคาต่อคืน</span>

        <strong>
        ${Number(
            booking.price_per_night || 0
        ).toLocaleString()}
        บาท
        </strong>

        </div>


        <div class="row">

        <span>💵 ราคาทั้งหมด</span>

        <strong>
        ${Number(
            booking.total_price || 0
        ).toLocaleString()}
        บาท
        </strong>

        </div>


        <div class="row">

        <span>สถานะ</span>

        <strong>
        ${getStatus(booking.status)}
        </strong>

        </div>


        </div>

        `
    ).join("");

}


/* ================================ */

function getStatus(status){

    if(status === "confirmed"){

        return `
        <span class="status confirmed">
        🟢 ยืนยันแล้ว
        </span>
        `;

    }


    if(status === "cancelled"){

        return `
        <span class="status cancelled">
        🔴 ยกเลิก
        </span>
        `;

    }


    return `
    <span class="status pending">
    🟡 รอยืนยัน
    </span>
    `;

}


/* ================================ */

function formatThaiDate(date){

    if(!date) return "-";

    return new Date(date)
    .toLocaleDateString(
        "th-TH",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* ================================ */

function escapeHtml(text){

    const div =
    document.createElement("div");

    div.textContent =
    text ?? "";

    return div.innerHTML;

}


/* ================================
   ดึงเบอร์เดิมจากเครื่อง
================================ */

const savedPhone =
localStorage.getItem(
    "lastBookingPhone"
);

if(savedPhone){

    document.getElementById(
        "phone"
    ).value =
    savedPhone;

    searchBookings();

}

</script>


</body>
</html>
