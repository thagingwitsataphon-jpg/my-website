<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>จัดการสมาชิก | Mon Bridge Stay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f8f9fa;
            color: #4e342e;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            min-height: 60px;
        }

        .navbar-brand {
            color: #795548 !important;
            font-size: 24px;
        }


        /* =========================
           CONTENT
        ========================== */

        .admin-container {

            margin-top: 45px;

            margin-bottom: 60px;

        }


        .page-title {

            color: #5d4037;

            font-weight: bold;

            font-size: 36px;

        }


        /* =========================
           STAT CARD
        ========================== */

        .stat-card {

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.08);

            height: 100%;

        }


        .stat-icon {

            font-size: 42px;

            margin-bottom: 8px;

        }


        .stat-label {

            color: #795548;

            font-size: 17px;

        }


        .stat-number {

            font-size: 30px;

            font-weight: bold;

            color: #5d4037;

            margin-top: 5px;

        }


        /* =========================
           ADMIN CARD
        ========================== */

        .admin-card {

            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.08);

        }


        /* =========================
           SEARCH
        ========================== */

        .search-box {

            border-radius: 10px;

            padding: 13px 16px;

            border: 1px solid #ced4da;

        }


        .search-box:focus {

            border-color: #795548;

            box-shadow:
                0 0 0 .2rem rgba(121,85,72,.15);

        }


        /* =========================
           TABLE
        ========================== */

        .table {

            margin-bottom: 0;

        }


        .table thead th {

            background: #795548;

            color: white;

            border-color: #795548;

            padding: 15px 12px;

            white-space: nowrap;

        }


        .table tbody td {

            padding: 14px 12px;

            vertical-align: middle;

        }


        .table tbody tr:hover {

            background: #faf7f5;

        }


        /* =========================
           DELETE BUTTON
        ========================== */

        .btn-delete {

            color: #dc3545;

            background: white;

            border: 1px solid #dc3545;

            border-radius: 8px;

            padding: 6px 12px;

        }


        .btn-delete:hover {

            background: #dc3545;

            color: white;

        }


        /* =========================
           EMPTY
        ========================== */

        .empty-box {

            text-align: center;

            padding: 60px 20px;

            color: #777;

        }


        .empty-icon {

            font-size: 65px;

            margin-bottom: 15px;

        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            background: #4e342e;

            color: white;

            padding: 25px 0;

            margin-top: 80px;

        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            .page-title {

                font-size: 28px;

            }

            .admin-card {

                padding: 18px;

            }

            .navbar-brand {

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">


        <!-- LOGO -->

        <a href="index.html"
           class="navbar-brand fw-bold text-decoration-none">

            🏡 Mon Bridge Stay

        </a>



        <!-- ADMIN -->

        <div class="d-flex align-items-center gap-2">


            <span class="d-none d-md-inline">

                👨‍💼 ผู้ดูแลระบบ

            </span>


            <button type="button"
                    onclick="logoutAdmin()"
                    class="btn btn-outline-danger">

                🚪 ออกจากระบบ

            </button>


        </div>


    </div>

</nav>



<!-- =====================================================
     MAIN
====================================================== -->

<div class="container admin-container">


    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="mb-4">

        <h1 class="page-title">

            👥 จัดการสมาชิก

        </h1>

        <p class="text-muted mb-0">

            ดูและจัดการข้อมูลสมาชิก Mon Bridge Stay

        </p>

    </div>



    <!-- =================================================
         STATISTICS
    ================================================== -->

    <div class="row g-4 mb-4">


        <!-- สมาชิกทั้งหมด -->

        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">

                    👥

                </div>

                <div class="stat-label">

                    สมาชิกทั้งหมด

                </div>

                <div id="totalUsers"
                     class="stat-number">

                    0

                </div>

            </div>

        </div>



        <!-- ผลการค้นหา -->

        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">

                    🔎

                </div>

                <div class="stat-label">

                    ผลการค้นหา

                </div>

                <div id="searchCount"
                     class="stat-number">

                    0

                </div>

            </div>

        </div>



        <!-- สถานะ -->

        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">

                    🟢

                </div>

                <div class="stat-label">

                    สถานะระบบ

                </div>

                <div class="stat-number"
                     style="font-size:22px;">

                    ออนไลน์

                </div>

            </div>

        </div>


    </div>



    <!-- =================================================
         MEMBER MANAGEMENT
    ================================================== -->

    <div class="admin-card">


        <!-- =================================================
             SEARCH
        ================================================== -->

        <div class="row g-3 mb-4">


            <div class="col-md-8">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control search-box"
                    placeholder="🔎 ค้นหาชื่อ นามสกุล อีเมล หรือเบอร์โทร..."
                    autocomplete="off">

            </div>


            <div class="col-md-4">

                <button
                    type="button"
                    onclick="clearSearch()"
                    class="btn btn-outline-secondary w-100 py-2">

                    ล้างการค้นหา

                </button>

            </div>


        </div>



        <!-- =================================================
             TABLE
        ================================================== -->

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th style="width:60px;">
                            #
                        </th>

                        <th>
                            ชื่อ
                        </th>

                        <th>
                            นามสกุล
                        </th>

                        <th>
                            เบอร์โทร
                        </th>

                        <th>
                            อีเมล
                        </th>

                        <th style="width:120px;">
                            จัดการ
                        </th>

                    </tr>

                </thead>


                <tbody id="userTableBody">

                </tbody>


            </table>

        </div>



        <!-- =================================================
             EMPTY
        ================================================== -->

        <div id="emptyBox"
             class="empty-box"
             style="display:none;">


            <div class="empty-icon">

                👥

            </div>


            <h5>

                ไม่พบสมาชิก

            </h5>


            <p class="mb-0">

                ยังไม่มีสมาชิกหรือไม่พบข้อมูลจากการค้นหา

            </p>


        </div>


    </div>


</div>



<!-- =====================================================
     FOOTER
====================================================== -->

<footer>

    <div class="container text-center">

        <h5>

            🏡 Mon Bridge Stay

        </h5>


        <p class="mb-0">

            ระบบจัดการสมาชิก

        </p>

    </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   1. ตรวจสอบสิทธิ์ Admin
===================================================== */

const adminStatus =
    localStorage.getItem(
        "monBridgeAdmin"
    );


if (adminStatus !== "true") {

    window.location.href =
        "admin-login.html";

}



/* =====================================================
   2. โหลดสมาชิก
===================================================== */

let users =
    JSON.parse(
        localStorage.getItem(
            "monBridgeUsers"
        )
    ) || [];



/* =====================================================
   3. Escape HTML
   ป้องกันข้อมูลสมาชิกถูกตีความเป็น HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   4. แสดงสมาชิก
===================================================== */

function displayUsers(searchText = "") {


    const tableBody =
        document.getElementById(
            "userTableBody"
        );


    const emptyBox =
        document.getElementById(
            "emptyBox"
        );


    const totalUsers =
        document.getElementById(
            "totalUsers"
        );


    const searchCount =
        document.getElementById(
            "searchCount"
        );


    /* ล้างตารางก่อน */

    tableBody.innerHTML = "";



    /* =================================================
       ค้นหา
    ================================================= */

    const search =
        searchText
            .trim()
            .toLowerCase();


    const filteredUsers =
        users.filter(
            function(user) {


                const firstName =
                    String(
                        user.firstName || ""
                    ).toLowerCase();


                const lastName =
                    String(
                        user.lastName || ""
                    ).toLowerCase();


                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();


                const phone =
                    String(
                        user.phone || ""
                    ).toLowerCase();


                const fullName =
                    firstName +
                    " " +
                    lastName;


                return (

                    firstName.includes(search) ||

                    lastName.includes(search) ||

                    fullName.includes(search) ||

                    email.includes(search) ||

                    phone.includes(search)

                );

            }
        );



    /* =================================================
       อัปเดตจำนวน
    ================================================= */

    totalUsers.textContent =
        users.length;


    searchCount.textContent =
        filteredUsers.length;



    /* =================================================
       ถ้าไม่มีข้อมูล
    ================================================= */

    if (
        filteredUsers.length === 0
    ) {

        emptyBox.style.display =
            "block";

        return;

    }


    emptyBox.style.display =
        "none";



    /* =================================================
       สร้างตาราง
    ================================================= */

    filteredUsers.forEach(
        function(user, filteredIndex) {


            /*
                หาตำแหน่งจริงของสมาชิก
                ใน Array users
            */

            const originalIndex =
                users.indexOf(user);


            const row =
                document.createElement(
                    "tr"
                );



            /* =================================================
               สร้างช่องต่าง ๆ
            ================================================= */

            const numberCell =
                document.createElement(
                    "td"
                );

            numberCell.textContent =
                filteredIndex + 1;



            const firstNameCell =
                document.createElement(
                    "td"
                );

            firstNameCell.textContent =
                user.firstName || "-";



            const lastNameCell =
                document.createElement(
                    "td"
                );

            lastNameCell.textContent =
                user.lastName || "-";



            const phoneCell =
                document.createElement(
                    "td"
                );

            phoneCell.textContent =
                user.phone || "-";



            const emailCell =
                document.createElement(
                    "td"
                );

            emailCell.textContent =
                user.email || "-";



            /* =================================================
               ปุ่มลบ
            ================================================= */

            const actionCell =
                document.createElement(
                    "td"
                );


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "btn btn-delete btn-sm";


            deleteButton.textContent =
                "🗑️ ลบ";


            /*
                ใช้ addEventListener
                แทน onclick
                เพื่อให้ปุ่มทำงานแน่นอน
            */

            deleteButton.addEventListener(
                "click",
                function() {

                    deleteUser(
                        originalIndex
                    );

                }
            );


            actionCell.appendChild(
                deleteButton
            );



            /* =================================================
               รวมแถว
            ================================================= */

            row.appendChild(
                numberCell
            );

            row.appendChild(
                firstNameCell
            );

            row.appendChild(
                lastNameCell
            );

            row.appendChild(
                phoneCell
            );

            row.appendChild(
                emailCell
            );

            row.appendChild(
                actionCell
            );


            tableBody.appendChild(
                row
            );

        }
    );

}



/* =====================================================
   5. ค้นหา
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            displayUsers(
                this.value
            );

        }
    );



/* =====================================================
   6. ล้างการค้นหา
===================================================== */

function clearSearch() {


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    searchInput.value = "";


    displayUsers();

}



/* =====================================================
   7. ลบสมาชิก
===================================================== */

function deleteUser(index) {


    /*
        โหลดข้อมูลใหม่จาก localStorage
        เพื่อให้แน่ใจว่าใช้ข้อมูลล่าสุด
    */

    users =
        JSON.parse(
            localStorage.getItem(
                "monBridgeUsers"
            )
        ) || [];



    /* ตรวจสอบ index */

    if (
        index < 0 ||
        index >= users.length
    ) {

        alert(
            "❌ ไม่พบข้อมูลสมาชิก"
        );

        return;

    }



    /* สมาชิกที่จะลบ */

    const user =
        users[index];



    /* =================================================
       ยืนยันการลบ
    ================================================= */

    const confirmDelete =
        confirm(

            "⚠️ ยืนยันการลบสมาชิก\n\n" +

            "ชื่อ: " +
            (user.firstName || "-") +
            " " +
            (user.lastName || "-") +

            "\nอีเมล: " +
            (user.email || "-") +

            "\n\nหากลบแล้วจะไม่สามารถกู้คืนข้อมูลนี้ได้\n\n" +

            "ต้องการลบหรือไม่?"

        );



    /* ถ้ายกเลิก */

    if (!confirmDelete) {

        return;

    }



    /* =================================================
       เก็บ Email ของสมาชิกที่จะลบ
    ================================================= */

    const deletedEmail =
        user.email;



    /* =================================================
       ลบออกจาก Array
    ================================================= */

    users.splice(
        index,
        1
    );



    /* =================================================
       บันทึกกลับ localStorage
    ================================================= */

    localStorage.setItem(
        "monBridgeUsers",
        JSON.stringify(users)
    );



    /* =================================================
       ตรวจสอบสมาชิกที่กำลัง Login
    ================================================= */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "monBridgeCurrentUser"
            )
        );


    if (
        currentUser &&
        currentUser.email ===
        deletedEmail
    ) {

        localStorage.removeItem(
            "monBridgeCurrentUser"
        );

    }



    /* =================================================
       โหลดข้อมูลใหม่
    ================================================= */

    const currentSearch =
        document
            .getElementById(
                "searchInput"
            )
            .value;


    displayUsers(
        currentSearch
    );



    /* =================================================
       แจ้งเตือน
    ================================================= */

    alert(
        "✅ ลบสมาชิกเรียบร้อยแล้ว"
    );

}



/* =====================================================
   8. ออกจากระบบ Admin
===================================================== */

function logoutAdmin() {


    localStorage.removeItem(
        "monBridgeAdmin"
    );


    window.location.href =
        "admin-login.html";

}



/* =====================================================
   9. แสดงข้อมูลเมื่อเปิดหน้า
===================================================== */

displayUsers();


</script>


</body>

</html>
```
