<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>จัดการการจอง | Mon Bridge Stay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f0e8;
    font-family:"Segoe UI","Tahoma",sans-serif;
    color:#4e342e;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#4e342e;
    color:white;
    padding:25px 15px;
}

.logo{
    font-size:25px;
    font-weight:700;
    padding:15px;
    margin-bottom:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:12px;
    margin-bottom:6px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#806052;
}

.main{
    margin-left:240px;
    padding:35px;
}

.header{
    background:white;
    border-radius:25px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.header h1{
    margin:0;
    font-size:34px;
}

.header p{
    margin:8px 0 0;
}

.buttons{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    border-radius:12px;
    padding:13px 20px;
    cursor:pointer;
    font-size:15px;
}

.btn-refresh{
    background:#e8e0d8;
    color:#5d4037;
}

.btn-guests{
    background:#795548;
    color:white;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
    margin:30px 0;
}

.card{
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card-number{
    font-size:38px;
    font-weight:800;
    color:#795548;
}

.card-title{
    font-size:17px;
    margin-top:5px;
}

.search-box{
    background:white;
    padding:25px;
    border-radius:22px;
    margin-bottom:25px;
}

.search{
    width:100%;
    height:52px;
    border:1px solid #d7c7bd;
    border-radius:12px;
    padding:0 18px;
    font-size:16px;
}

.table-box{
    background:white;
    border-radius:22px;
    padding:25px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th{
    background:#f6f0e7;
    padding:16px 12px;
    text-align:left;
}

td{
    padding:16px 12px;
    border-bottom:1px solid #eee4de;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.pending{
    background:#fff1c7;
    color:#936800;
}

.confirmed{
    background:#dff6e5;
    color:#19733b;
}

.cancelled{
    background:#ffe0e0;
    color:#b3261e;
}

.action-btn{
    border:none;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    margin-right:4px;
}

.confirm-btn{
    background:#dff6e5;
    color:#19733b;
}

.cancel-btn{
    background:#ffe0e0;
    color:#b3261e;
}

.delete-btn{
    background:#4e342e;
    color:white;
}

.empty{
    text-align:center;
    padding:50px;
    color:#795548;
}

@media(max-width:1000px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .main{
        padding:15px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .cards{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<aside class="sidebar">

    <div class="logo">
        🏠 Mon Bridge Stay
    </div>

    <a href="admin.html">
        📊 Dashboard
    </a>

    <a href="admin-rooms.html">
        🛏️ จัดการห้องพัก
    </a>

    <a href="admin-bookings.html"
       class="active">
        📅 จัดการการจอง
    </a>

    <a href="admin-promotions.html">
        🎁 โปรโมชั่น
    </a>

    <a href="admin-guests.html">
        👥 ผู้เข้าพัก
    </a>

    <a href="index.html">
        🌐 กลับหน้าเว็บไซต์
    </a>

</aside>


<main class="main">


    <div class="header">

        <div>

            <h1>
                📅 จัดการการจอง
            </h1>

            <p>
                ตรวจสอบ ยืนยัน และจัดการรายการจอง
            </p>

        </div>


        <div class="buttons">

            <button
                class="btn btn-refresh"
                onclick="loadBookings()">

                🔄 รีเฟรช

            </button>

            <a href="admin-guests.html"
               style="text-decoration:none">

                <button class="btn btn-guests">
                    👥 ดูผู้เข้าพัก
                </button>

            </a>

        </div>

    </div>


    <div class="cards">

        <div class="card">

            <div
                id="totalCount"
                class="card-number">
                0
            </div>

            <div class="card-title">
                📋 การจองทั้งหมด
            </div>

        </div>


        <div class="card">

            <div
                id="confirmedCount"
                class="card-number">
                0
            </div>

            <div class="card-title">
                🟢 ยืนยันแล้ว
            </div>

        </div>


        <div class="card">

            <div
                id="pendingCount"
                class="card-number">
                0
            </div>

            <div class="card-title">
                🟡 รอยืนยัน
            </div>

        </div>


        <div class="card">

            <div
                id="cancelledCount"
                class="card-number">
                0
            </div>

            <div class="card-title">
                🔴 ยกเลิก
            </div>

        </div>

    </div>


    <div class="search-box">

        <input
            id="search"
            class="search"
            placeholder="🔎 ค้นหารหัส ผู้เข้าพัก ที่พัก หรือวันที่...">

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>รหัส</th>

                    <th>ผู้เข้าพัก</th>

                    <th>ที่พัก</th>

                    <th>ประเภทห้อง</th>

                    <th>เช็กอิน</th>

                    <th>เช็กเอาต์</th>

                    <th>จำนวน</th>

                    <th>ราคา</th>

                    <th>สถานะ</th>

                    <th>จัดการ</th>

                </tr>

            </thead>

            <tbody id="bookingTable">

            </tbody>

        </table>

    </div>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let allBookings = [];


/* =========================================================
   โหลดการจอง
========================================================= */

async function loadBookings(){

    const tbody =
        document.getElementById(
            "bookingTable"
        );

    tbody.innerHTML = `

        <tr>
            <td colspan="10"
                style="text-align:center;padding:40px">

                ⏳ กำลังโหลดข้อมูล...

            </td>
        </tr>

    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("bookings")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        tbody.innerHTML = `

            <tr>
                <td colspan="10"
                    style="text-align:center;color:red;padding:40px">

                    ❌ โหลดข้อมูลไม่ได้<br>
                    ${error.message}

                </td>
            </tr>

        `;

        return;

    }


    allBookings =
        data || [];


    updateCards();

    renderBookings(
        allBookings
    );

}


/* =========================================================
   แสดงข้อมูล
========================================================= */

function renderBookings(bookings){

    const tbody =
        document.getElementById(
            "bookingTable"
        );


    if(!bookings.length){

        tbody.innerHTML = `

            <tr>
                <td colspan="10"
                    class="empty">

                    📭 ไม่พบรายการจอง

                </td>
            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        bookings.map(
            booking => {

                const status =
                    booking.status ||
                    "pending";


                let statusText =
                    "รอยืนยัน";

                let statusClass =
                    "pending";


                if(status === "confirmed"){

                    statusText =
                        "ยืนยันแล้ว";

                    statusClass =
                        "confirmed";

                }


                if(status === "cancelled"){

                    statusText =
                        "ยกเลิก";

                    statusClass =
                        "cancelled";

                }


                return `

                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(
                                booking.booking_code || "-"
                            )}
                        </strong>
                    </td>


                    <td>
                        ${escapeHtml(
                            booking.name || "-"
                        )}
                        <br>
                        <small>
                            ${escapeHtml(
                                booking.phone || ""
                            )}
                        </small>
                    </td>


                    <td>
                        ${escapeHtml(
                            booking.accommodation || "-"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            booking.room || "-"
                        )}
                    </td>


                    <td>
                        ${formatDate(
                            booking.check_in
                        )}
                    </td>


                    <td>
                        ${formatDate(
                            booking.check_out
                        )}
                    </td>


                    <td>
                        ${booking.guests || 0} คน
                    </td>


                    <td>
                        <strong>
                            ${Number(
                                booking.total_price || 0
                            ).toLocaleString()}
                            บาท
                        </strong>
                    </td>


                    <td>

                        <span class="status ${statusClass}">
                            ${statusText}
                        </span>

                    </td>


                    <td>

                        ${
                            status !== "confirmed"
                            ?
                            `
                            <button
                                class="action-btn confirm-btn"
                                onclick="changeStatus('${booking.id}','confirmed')">

                                ✓ ยืนยัน

                            </button>
                            `
                            :
                            ""
                        }


                        ${
                            status !== "cancelled"
                            ?
                            `
                            <button
                                class="action-btn cancel-btn"
                                onclick="changeStatus('${booking.id}','cancelled')">

                                ✕ ยกเลิก

                            </button>
                            `
                            :
                            ""
                        }


                        <button
                            class="action-btn delete-btn"
                            onclick="deleteBooking('${booking.id}')">

                            🗑 ลบ

                        </button>

                    </td>

                </tr>

                `;

            }
        ).join("");

}


/* =========================================================
   สถานะ
========================================================= */

async function changeStatus(
    id,
    status
){

    const {
        error
    } = await supabaseClient
        .from("bookings")
        .update({
            status:status
        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "ไม่สามารถเปลี่ยนสถานะได้\n" +
            error.message
        );

        return;

    }


    await loadBookings();

}


/* =========================================================
   ลบ
========================================================= */

async function deleteBooking(id){

    if(
        !confirm(
            "ต้องการลบรายการจองนี้หรือไม่?"
        )
    ){

        return;

    }


    const {
        error
    } = await supabaseClient
        .from("bookings")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "ลบไม่ได้\n" +
            error.message
        );

        return;

    }


    await loadBookings();

}


/* =========================================================
   Cards
========================================================= */

function updateCards(){

    const total =
        allBookings.length;


    const confirmed =
        allBookings.filter(
            b =>
            b.status === "confirmed"
        ).length;


    const pending =
        allBookings.filter(
            b =>
            !b.status ||
            b.status === "pending"
        ).length;


    const cancelled =
        allBookings.filter(
            b =>
            b.status === "cancelled"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "confirmedCount"
    ).textContent =
        confirmed;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "cancelledCount"
    ).textContent =
        cancelled;

}


/* =========================================================
   Search
========================================================= */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function(){

        const keyword =
            this.value
                .trim()
                .toLowerCase();


        if(!keyword){

            renderBookings(
                allBookings
            );

            return;

        }


        const filtered =
            allBookings.filter(
                booking => {

                    return [

                        booking.booking_code,

                        booking.name,

                        booking.phone,

                        booking.accommodation,

                        booking.room,

                        booking.check_in,

                        booking.check_out

                    ]
                    .filter(Boolean)
                    .some(
                        value =>
                        String(value)
                        .toLowerCase()
                        .includes(keyword)
                    );

                }
            );


        renderBookings(
            filtered
        );

    }
);


/* =========================================================
   Date
========================================================= */

function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(
            value + "T00:00:00"
        );

    return date.toLocaleDateString(
        "th-TH",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =========================================================
   ป้องกัน HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   START
========================================================= */

loadBookings();

</script>

</body>
</html>
