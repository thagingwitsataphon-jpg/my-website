<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>จัดการห้องพัก | Mon Bridge Stay</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

/* =====================================================
   พื้นฐาน
===================================================== */

body {
    margin: 0;
    background: #F7F3E8;
    color: #3E3328;
    font-family: Arial, sans-serif;
}


/* =====================================================
   Sidebar
===================================================== */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 300px;
    height: 100vh;
    background: #4E342E;
    color: white;
    padding: 30px 18px;
    z-index: 1000;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 35px;
}

.logo span {
    display: block;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu a {
    color: white;
    text-decoration: none;
    padding: 16px 22px;
    border-radius: 14px;
    font-size: 19px;
    font-weight: 500;
    transition: 0.2s;
}

.menu a:hover {
    background: #795548;
}

.menu a.active {
    background: #806052;
}


/* =====================================================
   เนื้อหา
===================================================== */

.main {
    margin-left: 300px;
    padding: 45px;
}


/* =====================================================
   Header
===================================================== */

.page-header {
    background: white;
    border-radius: 22px;
    padding: 30px 40px;
    margin-bottom: 35px;
    box-shadow: 0 5px 20px rgba(62, 51, 40, 0.08);

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.page-header h1 {
    margin: 0;
    color: #6D4C41;
    font-weight: bold;
    font-size: 40px;
}

.page-header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.btn-add {
    background: #795548;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 17px;
    transition: 0.2s;
    white-space: nowrap;
}

.btn-add:hover {
    background: #5D4037;
    color: white;
}


/* =====================================================
   ตาราง
===================================================== */

.room-box {
    background: white;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(62, 51, 40, 0.08);
}

.table {
    margin-bottom: 0;
}

.table thead th {
    background: #F7F3E8;
    color: #6D4C41;
    font-size: 17px;
    padding: 16px 12px;
    border-bottom: 2px solid #E0D2C5;
    white-space: nowrap;
}

.table tbody td {
    padding: 17px 12px;
    vertical-align: middle;
    font-size: 16px;
}

.table tbody tr:hover {
    background: #FCF9F3;
}


/* =====================================================
   สถานะ
===================================================== */

.status {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 14px;
    white-space: nowrap;
}

.status-open {
    background: #E8F3E8;
    color: #4E7A52;
}

.status-close {
    background: #F5E3E0;
    color: #A64B3C;
}


/* =====================================================
   ปุ่มจัดการ
===================================================== */

.btn-edit {
    background: #C8A27A;
    color: white;
    border: none;
    padding: 9px 17px;
    border-radius: 10px;
    margin-right: 5px;
    transition: 0.2s;
}

.btn-edit:hover {
    background: #B38D67;
    color: white;
}

.btn-delete {
    background: #B45D4C;
    color: white;
    border: none;
    padding: 9px 17px;
    border-radius: 10px;
    transition: 0.2s;
}

.btn-delete:hover {
    background: #934737;
    color: white;
}


/* =====================================================
   Modal
===================================================== */

.modal-content {
    border: none;
    border-radius: 18px;
    overflow: hidden;
}

.modal-header {
    background: #795548;
    color: white;
    border: none;
    padding: 18px 24px;
}

.modal-title {
    font-size: 22px;
    font-weight: bold;
}

.modal-body {
    padding: 25px;
}

.form-label {
    color: #6D4C41;
    font-weight: bold;
}

.form-control,
.form-select {
    border: 1px solid #D8CEC4;
    border-radius: 9px;
    padding: 11px 13px;
}

.form-control:focus,
.form-select:focus {
    border-color: #795548;
    box-shadow: 0 0 0 0.15rem rgba(121, 85, 72, 0.15);
}

.modal-footer {
    padding: 18px 25px;
    border-top: 1px solid #E5DED6;
}

.btn-save {
    background: #795548;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
}

.btn-save:hover {
    background: #5D4037;
    color: white;
}

.btn-cancel {
    background: #6C757D;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
}

.btn-cancel:hover {
    background: #5A6268;
    color: white;
}


/* =====================================================
   Responsive
===================================================== */

@media (max-width: 1100px) {

    .sidebar {
        width: 240px;
    }

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    .page-header h1 {
        font-size: 34px;
    }

}

@media (max-width: 900px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .room-box {
        overflow-x: auto;
    }

}

@media (max-width: 576px) {

    .main {
        padding: 15px;
    }

    .page-header {
        padding: 25px;
    }

    .page-header h1 {
        font-size: 30px;
    }

    .room-box {
        padding: 15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">

    <div class="logo">
        🏡 Mon Bridge
        <span>Stay</span>
    </div>

    <div class="menu">

        <a href="admin.html">
            📊 Dashboard
        </a>

        <a href="admin-rooms.html"
           class="active">
            🛏️ จัดการห้องพัก
        </a>

        <a href="admin-bookings.html">
            🗓️ การจอง
        </a>

        <a href="admin-promotions.html">
            🎁 โปรโมชั่น
        </a>

        <a href="admin-guests.html">
            👥 ผู้เข้าพัก
        </a>

        <a href="index.html">
            🌐 ดูหน้าเว็บไซต์
        </a>

        <a href="admin-login.html">
            🚪 ออกจากระบบ
        </a>

    </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="page-header">

        <div>

            <h1>
                🛏️ จัดการห้องพัก
            </h1>

            <p>
                เพิ่ม แก้ไข และจัดการข้อมูลห้องพักของ Mon Bridge Stay
            </p>

        </div>

        <button class="btn-add"
                type="button"
                onclick="openAddRoomModal()">

            ➕ เพิ่มห้องพัก

        </button>

    </div>


    <!-- =================================================
         ตารางห้องพัก
    ================================================== -->

    <div class="room-box">

        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>

                        <th>
                            ห้องพัก
                        </th>

                        <th>
                            ราคา
                        </th>

                        <th>
                            ผู้เข้าพัก
                        </th>

                        <th>
                            สถานะ
                        </th>

                        <th>
                            จัดการ
                        </th>

                    </tr>

                </thead>

                <tbody id="roomTable"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL เพิ่ม / แก้ไขห้องพัก
===================================================== -->

<div class="modal fade"
     id="roomModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="roomModalTitle">

                    🛏️ เพิ่มห้องพัก

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>


            <form id="roomForm">

                <div class="modal-body">

                    <!-- ใช้เก็บ ID ตอนแก้ไข -->

                    <input type="hidden"
                           id="roomId">


                    <div class="row g-3">


                        <!-- ชื่อห้อง -->

                        <div class="col-md-12">

                            <label class="form-label">
                                ชื่อห้องพัก
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="roomName"
                                   placeholder="เช่น ภูชมหมอก รีสอร์ท"
                                   required>

                        </div>


                        <!-- ราคา -->

                        <div class="col-md-6">

                            <label class="form-label">
                                ราคา
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="roomPrice"
                                   placeholder="เช่น 1,500 - 3,000 บาท"
                                   required>

                        </div>


                        <!-- จำนวนผู้เข้าพัก -->

                        <div class="col-md-6">

                            <label class="form-label">
                                จำนวนผู้เข้าพัก
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="roomGuests"
                                   min="1"
                                   placeholder="เช่น 4"
                                   required>

                        </div>


                        <!-- สถานะ -->

                        <div class="col-md-6">

                            <label class="form-label">
                                สถานะ
                            </label>

                            <select class="form-select"
                                    id="roomStatus">

                                <option value="open">
                                    เปิดให้จอง
                                </option>

                                <option value="close">
                                    ปิดให้จอง
                                </option>

                            </select>

                        </div>


                        <!-- รายละเอียด -->

                        <div class="col-md-12">

                            <label class="form-label">
                                รายละเอียดห้องพัก
                            </label>

                            <textarea class="form-control"
                                      id="roomDetail"
                                      rows="3"
                                      placeholder="รายละเอียดห้องพัก">
                            </textarea>

                        </div>


                        <!-- สิ่งอำนวยความสะดวก -->

                        <div class="col-md-12">

                            <label class="form-label">
                                สิ่งอำนวยความสะดวก
                            </label>

                            <textarea class="form-control"
                                      id="roomFacilities"
                                      rows="3"
                                      placeholder="เช่น Wi-Fi, เครื่องปรับอากาศ, ทีวี">
                            </textarea>

                        </div>


                    </div>

                </div>


                <div class="modal-footer">

                    <button type="button"
                            class="btn-cancel"
                            data-bs-dismiss="modal">

                        ยกเลิก

                    </button>

                    <button type="submit"
                            class="btn-save">

                        💾 บันทึกห้องพัก

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

/* =====================================================
   ตั้งค่า
===================================================== */

const STORAGE_KEY = "monBridgeRooms";


/* =====================================================
   ห้องพักเริ่มต้น
===================================================== */

const defaultRooms = [

    {
        id: "room-1",
        name: "ภูชมหมอก รีสอร์ท",
        price: "1,500 - 3,000 บาท",
        guests: 4,
        status: "open",
        detail: "",
        facilities: ""
    },

    {
        id: "room-2",
        name: "สามประสบรีสอร์ท",
        price: "1,126 บาท",
        guests: 2,
        status: "open",
        detail: "",
        facilities: ""
    },

    {
        id: "room-3",
        name: "บ้านมอญนอนเล่น",
        price: "590 - 690 บาท",
        guests: 2,
        status: "open",
        detail: "",
        facilities: ""
    },

    {
        id: "room-4",
        name: "สังขละวิลเลจ รีสอร์ท",
        price: "1,211 บาท",
        guests: 4,
        status: "open",
        detail: "",
        facilities: ""
    },

    {
        id: "room-5",
        name: "มาชิลล์ รีสอร์ท",
        price: "583 - 700 บาท",
        guests: 2,
        status: "open",
        detail: "",
        facilities: ""
    },

    {
        id: "room-6",
        name: "เบอมิซอินน์ รีสอร์ท",
        price: "1,000 บาท",
        guests: 4,
        status: "open",
        detail: "",
        facilities: ""
    }

];


/* =====================================================
   อ่านข้อมูลจาก localStorage
===================================================== */

function getRooms() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(defaultRooms)
        );

        return [...defaultRooms];

    }

    try {

        return JSON.parse(saved);

    } catch (error) {

        console.error(
            "ไม่สามารถอ่านข้อมูลห้องพักได้",
            error
        );

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(defaultRooms)
        );

        return [...defaultRooms];

    }

}


/* =====================================================
   บันทึกข้อมูล
===================================================== */

function saveRooms(rooms) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(rooms)
    );

}


/* =====================================================
   สร้าง ID
===================================================== */

function createRoomId() {

    return "room-" +
           Date.now() +
           "-" +
           Math.random()
               .toString(36)
               .substring(2, 8);

}


/* =====================================================
   ป้องกัน HTML
===================================================== */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   แสดงห้องพัก
===================================================== */

function renderRooms() {

    const table =
        document.getElementById("roomTable");

    const rooms = getRooms();

    table.innerHTML = "";


    if (rooms.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="5"
                    style="
                        text-align:center;
                        padding:40px;
                        color:#795548;
                    ">

                    🛏️ ยังไม่มีข้อมูลห้องพัก

                </td>

            </tr>

        `;

        return;

    }


    rooms.forEach(room => {

        const row =
            document.createElement("tr");


        const statusHTML =
            room.status === "open"

            ?

            `
            <span class="status status-open">
                เปิดให้จอง
            </span>
            `

            :

            `
            <span class="status status-close">
                ปิดให้จอง
            </span>
            `;


        row.innerHTML = `

            <td>

                <strong>
                    ${escapeHTML(room.name)}
                </strong>

            </td>


            <td>
                ${escapeHTML(room.price)}
            </td>


            <td>
                ${escapeHTML(room.guests)} คน
            </td>


            <td>
                ${statusHTML}
            </td>


            <td>

                <button
                    type="button"
                    class="btn-edit"
                    onclick="editRoom('${room.id}')">

                    ✏️ แก้ไข

                </button>


                <button
                    type="button"
                    class="btn-delete"
                    onclick="deleteRoom('${room.id}')">

                    🗑️ ลบ

                </button>

            </td>

        `;


        table.appendChild(row);

    });

}


/* =====================================================
   Bootstrap Modal
===================================================== */

let roomModal;


document.addEventListener(
    "DOMContentLoaded",
    function () {

        roomModal =
            new bootstrap.Modal(
                document.getElementById("roomModal")
            );


        renderRooms();


        document
            .getElementById("roomForm")
            .addEventListener(
                "submit",
                saveRoom
            );

    }
);


/* =====================================================
   เปิด Modal เพิ่มห้อง
===================================================== */

function openAddRoomModal() {

    document
        .getElementById("roomForm")
        .reset();


    document
        .getElementById("roomId")
        .value = "";


    document
        .getElementById("roomModalTitle")
        .innerHTML =
            "🛏️ เพิ่มห้องพัก";


    document
        .getElementById("roomStatus")
        .value = "open";


    roomModal.show();

}


/* =====================================================
   บันทึก เพิ่ม / แก้ไข
===================================================== */

function saveRoom(event) {

    event.preventDefault();


    const id =
        document
            .getElementById("roomId")
            .value;


    const name =
        document
            .getElementById("roomName")
            .value
            .trim();


    const price =
        document
            .getElementById("roomPrice")
            .value
            .trim();


    const guests =
        document
            .getElementById("roomGuests")
            .value;


    const status =
        document
            .getElementById("roomStatus")
            .value;


    const detail =
        document
            .getElementById("roomDetail")
            .value
            .trim();


    const facilities =
        document
            .getElementById("roomFacilities")
            .value
            .trim();


    if (!name || !price || !guests) {

        alert(
            "กรุณากรอกข้อมูลที่จำเป็นให้ครบ"
        );

        return;

    }


    let rooms = getRooms();


    /* ===============================================
       แก้ไข
    =============================================== */

    if (id) {

        const index =
            rooms.findIndex(
                room => room.id === id
            );


        if (index !== -1) {

            rooms[index] = {

                ...rooms[index],

                name: name,
                price: price,
                guests: Number(guests),
                status: status,
                detail: detail,
                facilities: facilities

            };

        }


        saveRooms(rooms);

        renderRooms();

        roomModal.hide();


        alert(
            "แก้ไขข้อมูลห้องพักเรียบร้อยแล้ว 🎉"
        );


        return;

    }


    /* ===============================================
       เพิ่มใหม่
    =============================================== */

    const newRoom = {

        id: createRoomId(),

        name: name,

        price: price,

        guests: Number(guests),

        status: status,

        detail: detail,

        facilities: facilities

    };


    rooms.push(newRoom);


    saveRooms(rooms);

    renderRooms();

    roomModal.hide();


    alert(
        "เพิ่มห้องพักเรียบร้อยแล้ว 🎉"
    );

}


/* =====================================================
   แก้ไขห้องพัก
===================================================== */

function editRoom(id) {

    const rooms = getRooms();


    const room =
        rooms.find(
            item => item.id === id
        );


    if (!room) {

        alert(
            "ไม่พบข้อมูลห้องพัก"
        );

        return;

    }


    document
        .getElementById("roomId")
        .value = room.id;


    document
        .getElementById("roomName")
        .value = room.name || "";


    document
        .getElementById("roomPrice")
        .value = room.price || "";


    document
        .getElementById("roomGuests")
        .value = room.guests || "";


    document
        .getElementById("roomStatus")
        .value =
            room.status || "open";


    document
        .getElementById("roomDetail")
        .value = room.detail || "";


    document
        .getElementById("roomFacilities")
        .value =
            room.facilities || "";


    document
        .getElementById("roomModalTitle")
        .innerHTML =
            "✏️ แก้ไขห้องพัก";


    roomModal.show();

}


/* =====================================================
   ลบห้องพัก
===================================================== */

function deleteRoom(id) {

    const rooms = getRooms();


    const room =
        rooms.find(
            item => item.id === id
        );


    if (!room) {

        alert(
            "ไม่พบข้อมูลห้องพัก"
        );

        return;

    }


    const confirmDelete =
        confirm(
            "ต้องการลบ \"" +
            room.name +
            "\" ใช่หรือไม่?"
        );


    if (!confirmDelete) {
        return;
    }


    const newRooms =
        rooms.filter(
            item => item.id !== id
        );


    saveRooms(newRooms);

    renderRooms();


    alert(
        "ลบ \"" +
        room.name +
        "\" เรียบร้อยแล้ว 🗑️"
    );

}


/* =====================================================
   ป้องกันข้อมูลหายเมื่อเปิดหน้าใหม่
===================================================== */

window.addEventListener(
    "storage",
    function () {

        renderRooms();

    }
);

</script>


</body>

</html>
