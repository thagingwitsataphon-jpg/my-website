<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>โปรไฟล์ของฉัน | Mon Bridge Stay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f8f9fa;
        }

        .profile-box {
            max-width: 550px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.10);
        }

        .profile-icon {
            font-size: 70px;
        }

        .profile-title {
            color: #5d4037;
            font-weight: bold;
        }

        .info-box {
            background: #faf7f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .btn-main {
            background: #795548;
            color: white;
            border: none;
        }

        .btn-main:hover {
            background: #5d4037;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html"
           style="color:#795548;">

            🏡 Mon Bridge Stay

        </a>

        <button onclick="logout()"
                class="btn btn-outline-danger">

            ออกจากระบบ

        </button>

    </div>

</nav>


<div class="container">

    <div class="profile-box">

        <div class="text-center mb-4">

            <div class="profile-icon">
                👤
            </div>

            <h2 class="profile-title">
                โปรไฟล์ของฉัน
            </h2>

            <p class="text-muted">
                ข้อมูลสมาชิก Mon Bridge Stay
            </p>

        </div>


        <div class="info-box">

            <strong>👤 ชื่อ - นามสกุล</strong>

            <div id="name"
                 class="mt-1">
            </div>

        </div>


        <div class="info-box">

            <strong>📱 เบอร์โทรศัพท์</strong>

            <div id="phone"
                 class="mt-1">
            </div>

        </div>


        <div class="info-box">

            <strong>📧 อีเมล</strong>

            <div id="email"
                 class="mt-1">
            </div>

        </div>


        <div class="text-center mt-4">

            <a href="index.html"
               class="btn btn-main px-4">

                🏠 กลับหน้าแรก

            </a>

        </div>

    </div>

</div>


<script>


// ตรวจสอบว่ามีสมาชิกเข้าสู่ระบบหรือไม่

const currentUser =
    JSON.parse(
        localStorage.getItem("monBridgeCurrentUser")
    );


// ถ้ายังไม่ได้เข้าสู่ระบบ
// ให้กลับไปหน้า Login

if (!currentUser) {

    window.location.href = "login.html";

}


// แสดงข้อมูลสมาชิก

if (currentUser) {

    document.getElementById("name").textContent =
        currentUser.firstName + " " +
        currentUser.lastName;


    document.getElementById("phone").textContent =
        currentUser.phone;


    document.getElementById("email").textContent =
        currentUser.email;

}


// ออกจากระบบ

function logout() {

    localStorage.removeItem(
        "monBridgeCurrentUser"
    );

    window.location.href = "login.html";

}

</script>


</body>

</html>
