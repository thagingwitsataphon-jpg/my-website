<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการโปรโมชั่น | Mon Bridge Stay</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f3e8;
      color: #111;
      font-family: "Tahoma", "Noto Sans Thai", sans-serif;
      overflow-x: hidden;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 88px;
      height: 100vh;
      background: #563b32;
      z-index: 10;
    }

    .sidebar .active {
      position: absolute;
      left: 0;
      top: 51%;
      width: 64px;
      height: 70px;
      border-radius: 0 18px 18px 0;
      background: #896957;
    }

    .main {
      margin-left: 88px;
      padding: 36px 40px 55px;
      min-height: 100vh;
    }

    .page-header {
      background: #fff;
      border-radius: 28px;
      padding: 30px 50px;
      min-height: 175px;
      box-shadow: 0 8px 24px rgba(62, 51, 40, .08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .header-icon {
      font-size: 48px;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #795548;
      font-size: 48px;
      font-weight: 800;
    }

    .header-subtitle {
      margin: 12px 0 0;
      font-size: 20px;
      color: #222;
    }

    .btn-main {
      background: #795548;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: .2s;
    }

    .btn-main:hover {
      background: #5d4037;
      color: #fff;
      transform: translateY(-1px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin: 38px 0 30px;
    }

    .stat-card {
      background: #fff;
      border-radius: 22px;
      padding: 27px 32px;
      min-height: 150px;
      box-shadow: 0 5px 20px rgba(62, 51, 40, .08);
    }

    .stat-number {
      font-size: 40px;
      font-weight: 800;
      color: #6b4638;
      line-height: 1;
      margin-bottom: 15px;
    }

    .stat-text {
      color: #795548;
      font-size: 19px;
    }

    .dot {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      vertical-align: -2px;
      margin-right: 8px;
    }

    .dot-green { background: #53d88c; }
    .dot-red { background: #e84761; }

    .table-card {
      background: #fff;
      border-radius: 25px;
      padding: 38px 38px 32px;
      box-shadow: 0 5px 20px rgba(62, 51, 40, .08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th {
      background: #f7f3e8;
      color: #795548;
      font-size: 18px;
      font-weight: 800;
      padding: 13px 10px;
      text-align: left;
      border-bottom: 2px solid #decabb;
      white-space: nowrap;
    }

    td {
      padding: 12px 10px;
      font-size: 18px;
      border-bottom: 1px solid #d9dfe4;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .promotion-name {
      font-weight: 800;
      white-space: nowrap;
    }

    .status {
      display: inline-block;
      padding: 10px 17px;
      border-radius: 25px;
      white-space: nowrap;
      font-size: 16px;
    }

    .status-active {
      background: #e5f3e8;
      color: #4f805b;
    }

    .status-inactive {
      background: #f7e3df;
      color: #b65042;
    }

    .actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-edit,
    .btn-delete {
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .btn-edit {
      background: #c7a27c;
    }

    .btn-edit:hover {
      background: #b58e67;
    }

    .btn-delete {
      background: #b65c4b;
    }

    .btn-delete:hover {
      background: #984837;
    }

    .empty-row {
      text-align: center;
      padding: 35px !important;
      color: #777;
    }

    /* Modal */
    .modal-backdrop-custom {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
    }

    .modal-backdrop-custom.show {
      display: flex;
    }

    .promotion-modal {
      width: min(1000px, 100%);
      max-height: calc(100vh - 35px);
      overflow-y: auto;
      background: #fff;
      border-radius: 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal-head {
      background: #795548;
      color: #fff;
      padding: 20px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 26px 26px 0 0;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 35px;
      line-height: 1;
      cursor: pointer;
      padding: 0 5px;
    }

    .modal-body {
      padding: 24px 25px;
    }

    .form-label {
      color: #795548;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .form-control,
    .form-select {
      min-height: 48px;
      font-size: 17px;
      border-radius: 8px;
    }

    textarea.form-control {
      min-height: 108px;
      resize: vertical;
    }

    .modal-footer {
      border-top: 1px solid #ddd;
      padding: 18px 25px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      border: none;
      background: #6c757d;
      color: #fff;
      border-radius: 9px;
      padding: 12px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save {
      border: none;
      background: #5d4037;
      color: #fff;
      border-radius: 9px;
      padding: 12px 22px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save:hover { background: #4e342e; }

    .toast-message {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: #5d4037;
      color: white;
      padding: 15px 22px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      display: none;
      z-index: 2000;
      font-size: 17px;
    }

    @media (max-width: 900px) {
      .sidebar { width: 60px; }
      .main { margin-left: 60px; padding: 20px; }
      .page-header { padding: 25px; flex-direction: column; align-items: flex-start; }
      h1 { font-size: 36px; }
      .stats { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .header-title { gap: 12px; }
      .header-icon { font-size: 38px; }
      h1 { font-size: 30px; }
      .header-subtitle { font-size: 16px; }
      .table-card { padding: 20px; }
      .modal-body { padding: 18px; }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="active"></div>
  </aside>

  <main class="main">
    <section class="page-header">
      <div>
        <div class="header-title">
          <span class="header-icon">🎁</span>
          <div>
            <h1>จัดการโปรโมชั่น</h1>
            <p class="header-subtitle">เพิ่ม แก้ไข และจัดการโปรโมชั่นของ Mon Bridge Stay</p>
          </div>
        </div>
      </div>

      <button class="btn-main" type="button" id="addPromotionBtn">
        ➕ เพิ่มโปรโมชั่น
      </button>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-text">🎁 โปรโมชั่นทั้งหมด</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="activeCount">0</div>
        <div class="stat-text"><span class="dot dot-green"></span>โปรโมชั่นที่เปิดใช้งาน</div>
      </div>

      <div class="stat-card">
        <div class="stat-number" id="inactiveCount">0</div>
        <div class="stat-text"><span class="dot dot-red"></span>โปรโมชั่นที่ปิดใช้งาน</div>
      </div>
    </section>

    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th>โปรโมชั่น</th>
            <th>รายละเอียด</th>
            <th>ส่วนลด</th>
            <th>วันเริ่มต้น</th>
            <th>วันสิ้นสุด</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="promotionTableBody"></tbody>
      </table>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop-custom" id="promotionModal" aria-hidden="true">
    <div class="promotion-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">🎁 เพิ่มโปรโมชั่น</h2>
        <button class="modal-close" type="button" id="closeModalBtn" aria-label="ปิด">×</button>
      </div>

      <form id="promotionForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="promotionName">ชื่อโปรโมชั่น</label>
              <input
                type="text"
                class="form-control"
                id="promotionName"
                placeholder="เช่น Weekend Special"
                required
              >
            </div>

            <div class="col-md-6">
              <label class="form-label" for="promotionDiscount">ส่วนลด</label>
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="promotionDiscount"
                  min="0"
                  max="100"
                  step="1"
                  placeholder="25"
                  required
                >
                <span class="input-group-text">%</span>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label" for="promotionDetail">รายละเอียดโปรโมชั่น</label>
              <textarea
                class="form-control"
                id="promotionDetail"
                rows="3"
                placeholder="รายละเอียดโปรโมชั่น"
                required
              ></textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="promotionStart">วันเริ่มต้น</label>
              <input type="date" class="form-control" id="promotionStart" required>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="promotionEnd">วันสิ้นสุด</label>
              <input type="date" class="form-control" id="promotionEnd" required>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="promotionStatus">สถานะ</label>
              <select class="form-select" id="promotionStatus">
                <option value="active">เปิดใช้งาน</option>
                <option value="inactive">ปิดใช้งาน</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancel" type="button" id="cancelBtn">ยกเลิก</button>
          <button class="btn-save" type="submit">💾 บันทึกโปรโมชั่น</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-message" id="toastMessage"></div>

  <script>
    "use strict";

    const STORAGE_KEY = "savedPromotions";

    const defaultPromotions = [
      {
        name: "Early Bird",
        detail: "จองล่วงหน้า รับส่วนลดพิเศษ",
        discount: 10,
        start: "2026-08-01",
        end: "2026-09-30",
        status: "active",
        icon: "🔥"
      },
      {
        name: "Family Package",
        detail: "สำหรับผู้เข้าพักแบบครอบครัว",
        discount: 15,
        start: "2026-08-01",
        end: "2026-12-31",
        status: "active",
        icon: "👨‍👩‍👧‍👦"
      },
      {
        name: "วันธรรมดาราคาพิเศษ",
        detail: "ราคาพิเศษสำหรับวันจันทร์–พฤหัสบดี",
        discount: 20,
        start: "2026-08-01",
        end: "2026-08-31",
        status: "inactive",
        icon: "🌄"
      }
    ];

    let savedPromotions = [];
    let editingIndex = -1;

    const tableBody = document.getElementById("promotionTableBody");
    const totalCount = document.getElementById("totalCount");
    const activeCount = document.getElementById("activeCount");
    const inactiveCount = document.getElementById("inactiveCount");

    const modal = document.getElementById("promotionModal");
    const modalTitle = document.getElementById("modalTitle");
    const form = document.getElementById("promotionForm");

    const nameInput = document.getElementById("promotionName");
    const discountInput = document.getElementById("promotionDiscount");
    const detailInput = document.getElementById("promotionDetail");
    const startInput = document.getElementById("promotionStart");
    const endInput = document.getElementById("promotionEnd");
    const statusInput = document.getElementById("promotionStatus");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function loadPromotions() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);

        if (stored) {
          const parsed = JSON.parse(stored);
          savedPromotions = Array.isArray(parsed) ? parsed : [...defaultPromotions];
        } else {
          savedPromotions = [...defaultPromotions];
          savePromotions();
        }
      } catch (error) {
        console.error("โหลดโปรโมชั่นไม่สำเร็จ:", error);
        savedPromotions = [...defaultPromotions];
      }
    }

    function savePromotions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPromotions));
    }

    function formatDate(dateString) {
      if (!dateString) return "-";

      const parts = dateString.split("-");
      if (parts.length !== 3) return escapeHTML(dateString);

      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function getStatus(promotion) {
      if (promotion.status === "active") {
        return {
          text: "เปิดใช้งาน",
          className: "status-active"
        };
      }

      return {
        text: "ปิดใช้งาน",
        className: "status-inactive"
      };
    }

    function updateStats() {
      const total = savedPromotions.length;
      const active = savedPromotions.filter(p => p.status === "active").length;
      const inactive = total - active;

      totalCount.textContent = total;
      activeCount.textContent = active;
      inactiveCount.textContent = inactive;
    }

    function renderPromotions() {
      tableBody.innerHTML = "";

      if (savedPromotions.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="empty-row">
              ยังไม่มีโปรโมชั่น กดปุ่ม "เพิ่มโปรโมชั่น" เพื่อสร้างรายการแรก
            </td>
          </tr>
        `;
        updateStats();
        return;
      }

      savedPromotions.forEach((promotion, index) => {
        const status = getStatus(promotion);
        const icon = promotion.icon || "🎁";

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>
            <span class="promotion-name">
              ${escapeHTML(icon)} ${escapeHTML(promotion.name)}
            </span>
          </td>

          <td>${escapeHTML(promotion.detail)}</td>

          <td>${escapeHTML(promotion.discount)}%</td>

          <td>${formatDate(promotion.start)}</td>

          <td>${formatDate(promotion.end)}</td>

          <td>
            <span class="status ${status.className}">
              ${status.text}
            </span>
          </td>

          <td>
            <div class="actions">
              <button
                type="button"
                class="btn-edit"
                data-action="edit"
                data-index="${index}">
                ✏️ แก้ไข
              </button>

              <button
                type="button"
                class="btn-delete"
                data-action="delete"
                data-index="${index}">
                🗑️ ลบ
              </button>
            </div>
          </td>
        `;

        tableBody.appendChild(row);
      });

      updateStats();
    }

    function openAddModal() {
      editingIndex = -1;

      modalTitle.textContent = "🎁 เพิ่มโปรโมชั่น";
      form.reset();
      statusInput.value = "active";

      openModal();
    }

    function openEditModal(index) {
      const promotion = savedPromotions[index];

      if (!promotion) {
        showToast("ไม่พบข้อมูลโปรโมชั่น");
        return;
      }

      editingIndex = index;

      modalTitle.textContent = "✏️ แก้ไขโปรโมชั่น";

      nameInput.value = promotion.name || "";
      discountInput.value = promotion.discount ?? "";
      detailInput.value = promotion.detail || "";
      startInput.value = promotion.start || "";
      endInput.value = promotion.end || "";
      statusInput.value = promotion.status || "active";

      openModal();
    }

    function openModal() {
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");

      setTimeout(() => {
        nameInput.focus();
      }, 50);
    }

    function closeModal() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      editingIndex = -1;
      form.reset();
    }

    function deletePromotion(index) {
      const promotion = savedPromotions[index];

      if (!promotion) {
        showToast("ไม่พบข้อมูลโปรโมชั่น");
        return;
      }

      const confirmed = confirm(
        `ต้องการลบโปรโมชั่น "${promotion.name}" ใช่หรือไม่?`
      );

      if (!confirmed) return;

      savedPromotions.splice(index, 1);
      savePromotions();
      renderPromotions();

      showToast("🗑️ ลบโปรโมชั่นเรียบร้อยแล้ว");
    }

    function savePromotion(event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const discount = Number(discountInput.value);
      const detail = detailInput.value.trim();
      const start = startInput.value;
      const end = endInput.value;
      const status = statusInput.value;

      if (!name || !detail || !start || !end) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง");
        return;
      }

      if (Number.isNaN(discount) || discount < 0 || discount > 100) {
        alert("ส่วนลดต้องอยู่ระหว่าง 0–100%");
        discountInput.focus();
        return;
      }

      if (end < start) {
        alert("วันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น");
        endInput.focus();
        return;
      }

      const promotionData = {
        name,
        detail,
        discount,
        start,
        end,
        status,
        icon: editingIndex >= 0
          ? (savedPromotions[editingIndex].icon || "🎁")
          : "🎁"
      };

      if (editingIndex >= 0) {
        savedPromotions[editingIndex] = promotionData;
        savePromotions();
        renderPromotions();
        closeModal();
        showToast("💾 แก้ไขโปรโมชั่นเรียบร้อยแล้ว");
      } else {
        savedPromotions.push(promotionData);
        savePromotions();
        renderPromotions();
        closeModal();
        showToast("🎉 เพิ่มโปรโมชั่นเรียบร้อยแล้ว");
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toastMessage");

      toast.textContent = message;
      toast.style.display = "block";

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.style.display = "none";
      }, 2200);
    }

    // ปุ่มเพิ่มโปรโมชั่น
    document.getElementById("addPromotionBtn").addEventListener("click", openAddModal);

    // ปุ่มปิด / ยกเลิก
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);

    // บันทึก
    form.addEventListener("submit", savePromotion);

    // จัดการปุ่มแก้ไขและลบด้วย event delegation
    tableBody.addEventListener("click", function(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) return;

      const index = Number(button.dataset.index);
      const action = button.dataset.action;

      if (action === "edit") {
        openEditModal(index);
      }

      if (action === "delete") {
        deletePromotion(index);
      }
    });

    // คลิกพื้นที่ด้านนอก Modal เพื่อปิด
    modal.addEventListener("click", function(event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    // กด Escape เพื่อปิด Modal
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && modal.classList.contains("show")) {
        closeModal();
      }
    });

    // โหลดข้อมูลทุกครั้งที่เปิดหน้า
    loadPromotions();
    renderPromotions();
  </script>
