<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | Mon Bridge Stay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body {
            background: #f8f9fa;
        }

        .navbar-brand {
            color: #795548;
        }

        .login-box {

            max-width: 450px;

            margin: 70px auto;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 5px 20px rgba(0,0,0,.10);

        }

        .login-title {

            color: #5d4037;

            font-weight: bold;

        }

        .btn-main {

            background: #795548;

            color: white;

            border: none;

        }

        .btn-main:hover {

            background: #5d4037;

            color: white;

        }

        .form-control {

            border-radius: 10px;

            padding: 12px;

        }

        footer {

            background: #4e342e;

            color: white;

            padding: 25px 0;

            margin-top: 80px;

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🏡 Mon Bridge Stay

        </a>


        <a href="index.html"
           class="btn btn-outline-secondary">

            🏠 หน้าแรก

        </a>

    </div>

</nav>



<!-- =========================
     LOGIN
========================== -->

<div class="container">

    <div class="login-box">

        <div class="text-center mb-4">

            <div style="font-size: 55px;">
                🔐
            </div>

            <h2 class="login-title">

                เข้าสู่ระบบ

            </h2>

            <p class="text-muted">

                เข้าสู่ระบบ Mon Bridge Stay

            </p>

        </div>



        <!-- อีเมล -->

        <div class="mb-3">

            <label class="form-label">

                📧 อีเมล

            </label>

            <input type="email"
                   class="form-control"
                   placeholder="กรอกอีเมลของคุณ">

        </div>



        <!-- รหัสผ่าน -->

        <div class="mb-3">

            <label class="form-label">

                🔒 รหัสผ่าน

            </label>

            <input type="password"
                   class="form-control"
                   placeholder="กรอกรหัสผ่าน">

        </div>



        <!-- จดจำ -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div class="form-check">

                <input class="form-check-input"
                       type="checkbox"
                       id="remember">

                <label class="form-check-label"
                       for="remember">

                    จดจำการเข้าสู่ระบบ

                </label>

            </div>


            <a href="#"
               style="color:#795548;">

                ลืมรหัสผ่าน?

            </a>

        </div>



        <!-- ปุ่มเข้าสู่ระบบ -->

        <button type="button"
                class="btn btn-main w-100 py-2">

            🔑 เข้าสู่ระบบ

        </button>



        <!-- สมัครสมาชิก -->

        <div class="text-center mt-4">

            <span class="text-muted">

                ยังไม่มีบัญชี?

            </span>

            <a href="register.html"
               style="color:#795548; font-weight:bold;">

                สมัครสมาชิก

            </a>

        </div>



        <hr class="my-4">



        <!-- กลับหน้าแรก -->

        <div class="text-center">

            <a href="index.html"
               class="text-decoration-none"
               style="color:#795548;">

                ← กลับหน้าแรก

            </a>

        </div>

    </div>

</div>



<!-- =========================
     FOOTER
========================== -->

<footer>

    <div class="container text-center">

        <h5>
            🏡 Mon Bridge Stay
        </h5>

        <p class="mb-0">

            เว็บไซต์แนะนำที่พักและสถานที่ท่องเที่ยวสังขละบุรี

        </p>

    </div>

</footer>


</body>

</html>
