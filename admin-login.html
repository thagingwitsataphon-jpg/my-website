<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบผู้ดูแล | Mon Bridge Stay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #F7F3E8;
            color: #3E3328;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }


        .login-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(62, 51, 40, 0.12);
        }


        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #795548;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }


        h2 {
            color: #5D4037;
            font-weight: bold;
        }


        .subtitle {
            color: #777;
            font-size: 14px;
        }


        .form-label {
            color: #5D4037;
            font-weight: 600;
        }


        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }


        .form-control:focus {
            border-color: #795548;
            box-shadow: 0 0 0 0.2rem rgba(121, 85, 72, 0.15);
        }


        .btn-login {
            background: #795548;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }


        .btn-login:hover {
            background: #5D4037;
            color: white;
        }


        .back-link {
            color: #795548;
            text-decoration: none;
            font-size: 14px;
        }


        .back-link:hover {
            color: #5D4037;
        }


        .notice {
            background: #F7F3E8;
            border-radius: 10px;
            padding: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #6D5A4D;
        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-card">


        <!-- LOGO -->

        <div class="logo">
            🏡
        </div>


        <!-- TITLE -->

        <div class="text-center mb-4">

            <h2>
                Mon Bridge Stay
            </h2>

            <p class="subtitle mb-0">
                ระบบจัดการสำหรับผู้ดูแล
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form onsubmit="loginAdmin(event)">


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">
                    👤 ชื่อผู้ใช้งาน
                </label>

                <input type="text"
                       id="username"
                       class="form-control"
                       placeholder="กรอกชื่อผู้ใช้งาน"
                       required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    🔒 รหัสผ่าน
                </label>

                <input type="password"
                       id="password"
                       class="form-control"
                       placeholder="กรอกรหัสผ่าน"
                       required>

            </div>


            <!-- REMEMBER -->

            <div class="form-check mb-4">

                <input class="form-check-input"
                       type="checkbox"
                       id="remember">

                <label class="form-check-label"
                       for="remember">

                    จดจำการเข้าสู่ระบบ

                </label>

            </div>


            <!-- BUTTON -->

            <button type="submit"
                    class="btn btn-login w-100">

                🔐 เข้าสู่ระบบ

            </button>


        </form>


        <!-- ERROR -->

        <div id="loginError"
             class="alert alert-danger mt-3 d-none">

            ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง

        </div>


        <!-- NOTICE -->

        <div class="notice text-center">

            🔐 หน้านี้สำหรับผู้ดูแลเว็บไซต์ Mon Bridge Stay

        </div>


        <!-- BACK -->

        <div class="text-center mt-4">

            <a href="index.html"
               class="back-link">

                ← กลับไปหน้าเว็บไซต์

            </a>

        </div>


    </div>

</div>


<script>

function loginAdmin(event) {

    event.preventDefault();


    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    /*
       ข้อมูลทดลองสำหรับระบบต้นแบบ
       ยังไม่ใช่ระบบรักษาความปลอดภัยจริง
    */

    if (username === "admin" && password === "1234") {

        window.location.href = "admin.html";

    } else {

        document
            .getElementById("loginError")
            .classList
            .remove("d-none");

    }

}

</script>


</body>

</html>
