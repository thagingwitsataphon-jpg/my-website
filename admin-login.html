
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>จัดการสมาชิก | Mon Bridge Stay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f8f9fa;
        }

        .navbar-brand {
            color: #795548;
        }

        .admin-container {

            margin-top: 40px;

            margin-bottom: 60px;

        }

        .admin-card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,.08);

        }

        .page-title {

            color: #5d4037;

            font-weight: bold;

        }

        .stat-card {

            background: white;

            border-radius: 15px;

            padding: 20px;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);

        }

        .stat-icon {

            font-size: 35px;

        }

        .stat-number {

            font-size: 28px;

            font-weight: bold;

            color: #5d4037;

        }

        .search-box {

            border-radius: 10px;

            padding: 12px;

        }

        .table th {

            background: #795548;

            color: white;

            white-space: nowrap;

        }

        .table td {

            vertical-align: middle;

        }

        .empty-box {

            text-align: center;

            padding: 40px;

            color: #777;

        }

        .btn-delete {

            color: #dc3545;

            border: 1px solid #dc3545;

            background: white;

        }

        .btn-delete:hover {

            color: white;

            background: #dc3545;

        }

        footer {

            background: #4e342e;

            color: white;

            padding: 25px 0;

            margin-top: 80px;

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a href="index.html"
           class="navbar-brand fw-bold">

            🏡 Mon Bridge Stay

        </a>


        <div>

            <span class="me-3">

                👨‍💼 ผู้ดูแลระบบ

            </span>


            <button onclick="logoutAdmin()"
                    class="btn btn-outline-danger">

                🚪 ออกจากระบบ

            </button>

        </div>

    </div>

</nav>



<!-- =========================
     ADMIN CONTENT
========================== -->

<div class="container admin-container">


    <!-- TITLE -->

    <div class="mb-4">

        <h2 class="page-title">

            👥 จัดการสมาชิก

        </h2>

        <p class="text-muted">

            ดูและจัดการข้อมูลสมาชิก Mon Bridge Stay

        </p>

    </div>



    <!-- =========================
         STAT
    ========================== -->

    <div class="row g-3 mb-4">


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div class="text-muted">

                    สมาชิกทั้งหมด

                </div>

                <div id="totalUsers"
                     class="stat-number">

                    0

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">
                    🔎
                </div>

                <div class="text-muted">

                    ผลการค้นหา

                </div>

                <div id="searchCount"
                     class="stat-number">

                    0

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <div class="stat-icon">
                    🟢
                </div>

                <div class="text-muted">

                    สถานะระบบ

                </div>

                <div class="stat-number"
                     style="font-size:20px;">

                    ออนไลน์

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         MEMBER TABLE
    ========================== -->

    <div class="admin-card">


        <!-- SEARCH -->

        <div class="row mb-4">

            <div class="col-md-8">

                <input type="text"
                       id="searchInput"
                       class="form-control search-box"
                       placeholder="🔎 ค้นหาชื่อ นามสกุล อีเมล หรือเบอร์โทร...">

            </div>

            <div class="col-md-4 mt-2 mt-md-0">

                <button onclick="clearSearch()"
                        class="btn btn-outline-secondary w-100 py-2">

                    ล้างการค้นหา

                </button>

            </div>

        </div>



        <!-- TABLE -->

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            ชื่อ
                        </th>

                        <th>
                            นามสกุล
                        </th>

                        <th>
                            เบอร์โทร
                        </th>

                        <th>
                            อีเมล
                        </th>

                        <th>
                            จัดการ
                        </th>

                    </tr>

                </thead>


                <tbody id="userTableBody">

                </tbody>

            </table>

        </div>


        <!-- EMPTY -->

        <div id="emptyBox"
             class="empty-box"
             style="display:none;">

            <div style="font-size:50px;">
                👥
            </div>

            <h5>

                ไม่พบสมาชิก

            </h5>

            <p>

                ยังไม่มีสมาชิกหรือไม่พบข้อมูลจากการค้นหา

            </p>

        </div>


    </div>


</div>



<!-- =========================
     FOOTER
========================== -->

<footer>

    <div class="container text-center">

        <h5>

            🏡 Mon Bridge Stay

        </h5>

        <p class="mb-0">

            ระบบจัดการสมาชิก

        </p>

    </div>

</footer>



<script>


/* =========================
   ตรวจสอบ Admin
========================= */

const isAdmin =
    localStorage.getItem(
        "monBridgeAdmin"
    );


if (isAdmin !== "true") {

    window.location.href =
        "admin-login.html";

}



/* =========================
   โหลดสมาชิก
========================= */

let users =
    JSON.parse(
        localStorage.getItem(
            "monBridgeUsers"
        )
    ) || [];



/* =========================
   แสดงสมาชิก
========================= */

function displayUsers(
    searchText = ""
) {


    const tableBody =
        document.getElementById(
            "userTableBody"
        );


    const emptyBox =
        document.getElementById(
            "emptyBox"
        );


    tableBody.innerHTML = "";



    /* =========================
       กรองข้อมูล
    ========================== */

    const search =
        searchText
            .toLowerCase()
            .trim();


    const filteredUsers =
        users.filter(
            function(user) {

                const text =
                    (
                        user.firstName +
                        " " +
                        user.lastName +
                        " " +
                        user.email +
                        " " +
                        user.phone
                    )
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );



    /* จำนวน */

    document
        .getElementById(
            "totalUsers"
        )
        .textContent =
            users.length;


    document
        .getElementById(
            "searchCount"
        )
        .textContent =
            filteredUsers.length;



    /* ไม่มีสมาชิก */

    if (
        filteredUsers.length === 0
    ) {

        emptyBox.style.display =
            "block";

        return;

    }


    emptyBox.style.display =
        "none";



    /* =========================
       สร้างตาราง
    ========================== */

    filteredUsers.forEach(
        function(user, index) {


            const originalIndex =
                users.indexOf(user);


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(user.firstName)}
                </td>

                <td>
                    ${escapeHTML(user.lastName)}
                </td>

                <td>
                    ${escapeHTML(user.phone)}
                </td>

                <td>
                    ${escapeHTML(user.email)}
                </td>

                <td>

                    <button
                        onclick="deleteUser(${originalIndex})"
                        class="btn btn-delete btn-sm">

                        🗑️ ลบ

                    </button>

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}



/* =========================
   ค้นหา
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            displayUsers(
                this.value
            );

        }
    );



/* =========================
   ล้างการค้นหา
========================= */

function clearSearch() {

    document
        .getElementById(
            "searchInput"
        )
        .value = "";


    displayUsers();

}



/* =========================
   ลบสมาชิก
========================= */

function deleteUser(index) {


    const user =
        users[index];


    if (!user) {

        return;

    }


    const confirmDelete =
        confirm(
            "ต้องการลบสมาชิก " +
            user.firstName +
            " " +
            user.lastName +
            " ใช่หรือไม่?"
        );


    if (!confirmDelete) {

        return;

    }



    /* ลบ */

    users.splice(
        index,
        1
    );


    /* บันทึกใหม่ */

    localStorage.setItem(
        "monBridgeUsers",
        JSON.stringify(users)
    );



    /* ถ้าคนที่ลบเป็นสมาชิกปัจจุบัน
       ให้ Logout ออกด้วย */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "monBridgeCurrentUser"
            )
        );


    if (
        currentUser &&
        currentUser.email === user.email
    ) {

        localStorage.removeItem(
            "monBridgeCurrentUser"
        );

    }



    /* แสดงตารางใหม่ */

    displayUsers(
        document
            .getElementById(
                "searchInput"
            )
            .value
    );



    alert(
        "ลบสมาชิกเรียบร้อยแล้ว"
    );

}



/* =========================
   Logout Admin
========================= */

function logoutAdmin() {

    localStorage.removeItem(
        "monBridgeAdmin"
    );


    window.location.href =
        "admin-login.html";

}



/* =========================
   ป้องกัน HTML แปลกปลอม
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =========================
   เริ่มต้น
========================= */

displayUsers();

</script>


</body>

</html>
